# Fixed Blueprint: Voice - Perform Google Search (Anti-loop + Reliable Output)
#==============================================================
# This version improves:
# - Prevents infinite loops
# - Forces Google Search tool usage
# - Ensures the LLM always returns structured results
# - Ensures at least one real result must appear
#==============================================================

blueprint:
  name: Voice - Perform Google Search (Fixed)
  author: luuquangvu
  description: >-
    Voice Google Search tool using Google Generative AI.
  domain: script
  homeassistant:
    min_version: 2025.4.0

  input:
    agent_settings:
      name: Settings for Conversation Agent
      icon: mdi:robot-outline
      description: Conversation Agent with Google Search tool enabled.
      input:
        agent_id:
          name: Conversation Agent
          selector:
            entity:
              filter:
                domain: conversation

    prompt_settings:
      name: Extra Prompts
      icon: mdi:robot
      collapsed: true
      input:
        query_string_prompt:
          name: Query String Prompt
          selector:
            text:
              multiline: true
          default: >-
            Provide only the clean Google search query.
            Correct spelling silently.
            Never ask clarification questions.
        language_prompt:
          name: Language Prompt
          selector:
            text:
              multiline: true
          default: >-
            Provide the output language using IETF BCP 47 tags.

mode: parallel
max_exceeded: silent
variables:
  version: 20251121

fields:
  query_string:
    name: Query String
    description: !input query_string_prompt
    selector:
      text:
    required: true

  language:
    name: Language
    description: !input language_prompt
    selector:
      text:
    required: true

sequence:
  - variables:
      query_string: "{{ query_string | trim }}"
      language: "{{ language | trim }}"

  - alias: Validate Input
    if:
      - condition: template
        value_template: "{{ not query_string or not language }}"
    then:
      - variables:
          response:
            error: "Query or language is empty"
      - stop: Query or language is empty
        response_variable: response

  # MAIN GOOGLE SEARCH ACTION
  - alias: Perform Google Search
    action: conversation.process
    response_variable: response
    data:
      agent_id: !input agent_id
      language: "{{ language }}"
      text: >-
        You MUST perform a single Google Search using the Google Search tool.

        STRICT RULES:
        - ABSOLUTELY NO LOOPS.
        - DO NOT self-correct or think iteratively.
        - Perform EXACTLY ONE Google Search call.
        - Return real results from the Google Search tool only.
        - If search returns 0 results, say "Không tìm thấy kết quả" (or match language).
        - Output must follow this structure:

        ### Summary
        (Short summary)

        ### Key Points
        - (3–6 bullet points)

        ### Sources
        - (Website name — date)

        ---------------------------------------------------
        QUERY TO SEARCH:
        {{ query_string }}

  - stop: ""
    response_variable: response
