blueprint:
  name: Voice - Perform Google Search (Fixed)
  author: luuquangvu
  description: >-
    # Tool for searching Google information used for Voice Assistant
    ## Blueprint Setup
    ### Required
    * This blueprint is exclusively designed for Google Generative AI only.
    * A Conversation Agent with Google Search tool enabled, create it if it doesn't already exist.
    * Increase the agent's maximum token limit to enable it to gather comprehensive information, with a minimum requirement of 16384 tokens.
    * Agent Instructions:
    ```
    You are a voice assistant. Always respond in the same language as the user's message. 
    If in Vietnamese, reply in Vietnamese; if in English, reply in English. 
    Current date and time: {{ now().isoformat(timespec='seconds') }}.
    ```
  domain: script
  homeassistant:
    min_version: 2025.4.0
  input:
    agent_settings:
      name: Settings for Conversation Agent
      icon: mdi:robot-outline
      description: These settings enable you to configure the conversation agent used for searching Google information.
      input:
        agent_id:
          name: Conversation Agent
          selector:
            entity:
              filter:
                domain: conversation
    prompt_settings:
      name: Prompt settings for the LLM
      icon: mdi:robot
      description: You can use these settings to finetune the prompts for your specific LLM (model). In most cases the defaults should be fine.
      collapsed: true
      input:
        query_string_prompt:
          name: Query String Prompt
          description: The prompt which will be used for the LLM can provide the search string for the query.
          selector:
            text:
              multiline: true
          default: >-
            Specify the search string to obtain information from Google.
            If the query seems misspelled or misheard, silently correct it to the most likely intended search string.
        language_prompt:
          name: Language Prompt
          description: The prompt which will be used for the LLM can provide the language for the query.
          selector:
            text:
              multiline: true
          default: >-
            Specify the output language of the response using an IETF BCP 47 language tag (e.g., vi-VN, en-US). 
            The value must match the user's language.
mode: single
max_exceeded: silent
description: Searches Google based on a query string.
variables:
  version: 20251116
fields:
  query_string:
    name: Query String
    description: !input query_string_prompt
    selector:
      text:
    required: true
  language:
    name: Language
    description: !input language_prompt
    selector:
      text:
    required: true
sequence:
  - variables:
      query_string: "{{ query_string | default('') | trim }}"
      language: "{{ language | default('') | trim }}"
  - alias: Check if variables were set correctly
    if:
      - condition: template
        value_template: "{{ not query_string or not language }}"
    then:
      - stop: "Unable to search for information because the query string or language is empty."
        response_variable: response
  - alias: Perform Google Search
    action: conversation.process
    response_variable: search_result
    data:
      agent_id: !input agent_id
      text: >-
        SEARCH_QUERY: {{ query_string }}
        LANGUAGE: {{ language }}
        
        Please use the Google Search tool to find current and accurate information about this query.
        Provide a comprehensive answer based on the search results.
      language: "{{ language }}"
  - variables:
      final_response: >
        {% if search_result.response.speech.text is defined %}
          {{ search_result.response.speech.text }}
        {% else %}
          No information found from Google Search for: {{ query_string }}
        {% endif %}
  - stop: ""
    response_variable: final_response
