blueprint:
  name: Voice - Perform Google Search
  author: luuquangvu
  description: >-
    Tool for performing a single-pass, reliable Google Search without looping.

    This blueprint sends a clean, deterministic request to the conversation agent,
    forcing it to use the Google Search tool exactly once, avoiding iterative refinement,
    recursion, looping, or self-calling behaviors.

    Ensure the Conversation Agent has Google Search tool enabled.

  domain: script
  homeassistant:
    min_version: 2025.4.0

  input:
    agent_settings:
      name: Settings for Conversation Agent
      icon: mdi:robot-outline
      description: Choose the conversation agent that has Google Search enabled.
      input:
        agent_id:
          name: Conversation Agent
          selector:
            entity:
              filter:
                domain: conversation

    prompt_settings:
      name: Prompt Settings for the LLM
      icon: mdi:robot
      collapsed: true
      description: Optional prompt finetuning.
      input:
        query_string_prompt:
          name: Query String Prompt
          selector:
            text:
              multiline: true
          default: >-
            Provide the exact search query for Google Search. If misspelled, silently correct it.
            Do not ask for clarification.

        language_prompt:
          name: Language Prompt
          selector:
            text:
              multiline: true
          default: >-
            Provide the response language using IETF BCP-47 code (e.g., vi-VN, en-US).
            Must match the user's language.

mode: parallel
max_exceeded: silent
description: Searches Google in a single-pass, non-looping process.

variables:
  version: 20251121

fields:
  query_string:
    name: Query String
    description: !input query_string_prompt
    selector:
      text:
    required: true

  language:
    name: Language
    description: !input language_prompt
    selector:
      text:
    required: true

sequence:

  - variables:
      query_string: "{{ query_string | default('') | trim }}"
      language: "{{ language | default('') | trim }}"

  - alias: Validate input
    if:
      - condition: template
        value_template: "{{ not query_string or not language }}"
    then:
      - variables:
          response:
            error: Missing query string or language.
      - stop: Missing query string or language.
        response_variable: response

  - alias: Perform search via conversation agent
    action: conversation.process
    response_variable: response
    data:
      agent_id: !input agent_id
      language: "{{ language }}"
      text: >-
        You MUST use the Google Search tool EXACTLY ONCE to gather information about:

        "{{ query_string }}"

        RULES:
        - Do not refine the query.
        - Do not perform multiple searches.
        - Do not create loops, summaries of summaries, or follow-up internal requests.
        - Do not attempt recursive or iterative reasoning.
        - No "improving" the query unless spelling correction is needed.
        - Never fabricate sources.
        - If results are empty, return: "No results found. Try a different query."

        OUTPUT FORMAT:
        1) Short summary (4–6 sentences)
        2) Detailed findings
        3) Optional: Source names (publisher/site + date)

  - stop: ""
    response_variable: response
