blueprint:
  name: Blueprint trống - TTS chọn service
  description: >
    Blueprint khung trống cho TTS.
    Cho phép chọn sensor trigger, media_player
    và chọn service TTS (google, cloud, notify...)
  domain: automation

  input:
    trigger_entity:
      name: Sensor / nút kích hoạt
      selector:
        entity: {}

    trigger_from:
      name: Trạng thái from (tùy chọn)
      default: ""
      selector:
        text:

    trigger_to:
      name: Trạng thái to (tùy chọn)
      default: ""
      selector:
        text:

    tts_service:
      name: Service TTS
      description: >
        Ví dụ:
        - tts.google_translate_say
        - tts.cloud_say
        - notify.mobile_app_xxx
      selector:
        text:

    media_player:
      name: Media Player (nếu service cần)
      selector:
        entity:
          domain: media_player

    message:
      name: Nội dung đọc
      default: "Nội dung nhắc nhở"
      selector:
        text:
          multiline: true

    language:
      name: Ngôn ngữ (nếu service hỗ trợ)
      default: vi
      selector:
        text:

mode: single

trigger:
  - platform: state
    entity_id: !input trigger_entity
    from: !input trigger_from
    to: !input trigger_to

condition: []

action:
  - service: !input tts_service
    target:
      entity_id: !input media_player
    data:
      message: !input message
      language: !input language
