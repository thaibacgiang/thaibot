blueprint:
  name: Telegram AI Image Analyzer
  author: ThaiDV
  description: >
    Nhận ảnh từ Telegram Bot Home Assistant
    và dùng AI Task phân tích ảnh.

  domain: automation

  homeassistant:
    min_version: 2025.8.0

  input:

    ai_task_settings:
      name: AI Task Settings
      icon: mdi:robot-outline
      input:

        ai_task_entity:
          name: AI Task Entity
          selector:
            entity:
              filter:
                - domain:
                    - ai_task
              multiple: false
              reorder: false
          default:

    telegram_settings:
      name: Telegram Settings
      icon: mdi:telegram
      input:

        telegram_chat_id:
          name: Telegram Chat ID
          selector:
            text:

    prompt_settings:
      name: Prompt Settings
      icon: mdi:text-box-outline
      collapsed: true
      input:

        prompt:
          name: Prompt phân tích
          default: >
            Hãy phân tích chi tiết ảnh này bằng tiếng Việt.

            - Mô tả toàn cảnh
            - Nhận diện người và hành động
            - Nhận diện xe cộ, động vật, đồ vật
            - Phát hiện bất thường nếu có
            - Trả lời tự nhiên và ngắn gọn
          selector:
            text:
              multiline: true

mode: restart

trigger:
  - platform: event
    event_type: telegram_photo

variables:

  ai_task_entity: !input ai_task_entity

  telegram_chat_id: !input telegram_chat_id

  prompt: !input prompt

  event_data: "{{ trigger.event.data }}"

  caption: "{{ event_data.caption | default('') }}"

  #############################################################
  # FILE ẢNH TELEGRAM
  #############################################################

  image_file: >
    {{ event_data.file }}

  final_prompt: >
    {{ prompt }}

    {% if caption != '' %}
    Người dùng yêu cầu thêm:
    {{ caption }}
    {% endif %}

action:

  #############################################################
  # TẠO ATTACHMENT
  #############################################################

  - variables:

      image_attachment:
        media_content_id: "{{ image_file }}"
        media_content_type: image/jpeg
        metadata:
          title: Telegram Image
          media_class: image

  #############################################################
  # AI TASK
  #############################################################

  - action: ai_task.generate_data
    data:

      entity_id: "{{ ai_task_entity }}"

      task_name: Telegram Image Analysis

      instructions: "{{ final_prompt }}"

      attachments:
        - "{{ image_attachment }}"

    response_variable: ai_result

  #############################################################
  # GỬI KẾT QUẢ
  #############################################################

  - action: telegram_bot.send_message
    data:

      target: "{{ telegram_chat_id }}"

      message: >
        🤖 PHÂN TÍCH AI

        {{ ai_result.data if ai_result.data is defined else 'Không có phản hồi' }}
