blueprint:
  name: Telegram AI phân tích ảnh bằng AI Task
  description: >
    Nhận ảnh từ Telegram Bot trong Home Assistant,
    gửi sang AI Task để phân tích và trả kết quả lại Telegram.

    Hỗ trợ:
    - Phân tích người, xe, vật thể
    - Nhận diện hành động
    - Phát hiện bất thường
    - Caption yêu cầu riêng
    - Gemini / OpenAI / Claude qua AI Task

  domain: automation

  input:

    telegram_bot_id:
      name: Telegram Bot
      description: Chọn bot Telegram đã cấu hình
      selector:
        entity:
          domain: telegram_bot

    ai_task_entity:
      name: AI Task
      description: Chọn entity AI Task
      selector:
        entity:
          domain: assist_satellite

    telegram_chat_id:
      name: Telegram Chat ID
      description: ID chat Telegram nhận kết quả
      selector:
        text:

    prompt:
      name: Prompt phân tích ảnh
      default: >
        Hãy phân tích chi tiết ảnh này bằng tiếng Việt.

        Yêu cầu:
        - Mô tả toàn cảnh
        - Nhận diện người và hành động
        - Mô tả trang phục
        - Nhận diện xe cộ, động vật, đồ vật
        - Phát hiện nguy hiểm hoặc bất thường nếu có
        - Trả lời ngắn gọn nhưng đầy đủ

      selector:
        text:
          multiline: true

mode: restart

trigger:
  - platform: event
    event_type: telegram_photo

variables:
  event_data: "{{ trigger.event.data }}"
  file_id: "{{ event_data.photo[-1].file_id }}"
  caption: "{{ event_data.caption | default('') }}"
  bot_entity: !input telegram_bot_id
  ai_task: !input ai_task_entity
  telegram_chat_id: !input telegram_chat_id
  prompt: !input prompt

action:

  #################################################################
  # LẤY FILE TELEGRAM
  #################################################################
  - service: telegram_bot.get_file
    data:
      file_id: "{{ file_id }}"
    response_variable: telegram_file

  - variables:
      file_path: "{{ telegram_file.file_path }}"
      local_file: "/config/www/telegram_ai/latest.jpg"

  #################################################################
  # DOWNLOAD ẢNH
  #################################################################
  - service: downloader.download_file
    data:
      url: >
        https://api.telegram.org/file/bot
        {{ state_attr(bot_entity,'token') }}/{{ file_path }}

      filename: latest.jpg
      subdir: telegram_ai
      overwrite: true

  - delay:
      seconds: 2

  #################################################################
  # AI TASK PHÂN TÍCH
  #################################################################
  - service: assist_satellite.ask_question
    target:
      entity_id: "{{ ai_task }}"
    data:
      question: >
        {{ prompt }}

        {% if caption != '' %}
        Người dùng yêu cầu thêm:
        {{ caption }}
        {% endif %}

      image_filename:
        - "{{ local_file }}"

    response_variable: ai_result

  #################################################################
  # GỬI KẾT QUẢ
  #################################################################
  - service: telegram_bot.send_message
    data:
      target: "{{ telegram_chat_id }}"
      message: |
        🤖 PHÂN TÍCH ẢNH AI

        {{ ai_result.answer | default('Không có phản hồi') }}

  - service: telegram_bot.send_photo
    data:
      target: "{{ telegram_chat_id }}"
      file: "{{ local_file }}"
      caption: "Ảnh đã phân tích"
