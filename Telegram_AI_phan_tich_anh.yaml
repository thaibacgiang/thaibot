blueprint:
  name: Telegram AI Image Analyzer
  author: ThaiDV
  description: >
    Nhận ảnh từ Telegram và dùng AI Task phân tích ảnh.

    Hỗ trợ:
    - Gemini/OpenAI/Claude qua AI Task
    - Caption yêu cầu riêng
    - Phân tích người, xe, vật thể
    - Phát hiện bất thường

  domain: automation

  homeassistant:
    min_version: 2025.8.0

  input:

    ai_task_settings:
      name: AI Task Settings
      icon: mdi:robot-outline
      input:

        ai_task_entity:
          name: AI Task Entity
          selector:
            entity:
              filter:
                - domain:
                    - ai_task
              multiple: false
              reorder: false
          default:

    telegram_settings:
      name: Telegram Settings
      icon: mdi:telegram
      input:

        telegram_bot_token:
          name: Telegram Bot Token
          selector:
            text:

        telegram_chat_id:
          name: Telegram Chat ID
          selector:
            text:

    prompt_settings:
      name: Prompt Settings
      icon: mdi:text-box-outline
      collapsed: true
      input:

        prompt:
          name: Prompt phân tích
          default: >
            Hãy phân tích chi tiết ảnh này bằng tiếng Việt.

            Yêu cầu:
            - Mô tả toàn cảnh
            - Nhận diện người và hành động
            - Mô tả trang phục
            - Nhận diện xe cộ, động vật, đồ vật
            - Phát hiện nguy hiểm hoặc bất thường nếu có
            - Trả lời tự nhiên, ngắn gọn
          selector:
            text:
              multiline: true

mode: restart

trigger:
  - platform: event
    event_type: telegram_photo

variables:

  event_data: "{{ trigger.event.data }}"

  file_id: "{{ event_data.photo[-1].file_id }}"

  caption: "{{ event_data.caption | default('') }}"

  ai_task_entity: !input ai_task_entity

  telegram_bot_token: !input telegram_bot_token

  telegram_chat_id: !input telegram_chat_id

  prompt: !input prompt

action:

  #############################################################
  # LẤY FILE TỪ TELEGRAM
  #############################################################

  - action: telegram_bot.get_file
    data:
      file_id: "{{ file_id }}"
    response_variable: telegram_file

  - variables:

      file_path: "{{ telegram_file.file_path }}"

      local_file: "/config/www/telegram_ai/latest.jpg"

  #############################################################
  # DOWNLOAD ẢNH
  #############################################################

  - action: downloader.download_file
    data:
      url: >
        https://api.telegram.org/file/bot{{ telegram_bot_token }}/{{ file_path }}

      filename: latest.jpg

      subdir: telegram_ai

      overwrite: true

  - delay:
      seconds: 2

  #############################################################
  # TẠO ATTACHMENT CHO AI TASK
  #############################################################

  - variables:

      image_attachment:
        media_content_id: media-source://media_source/local/telegram_ai/latest.jpg
        media_content_type: image/jpeg
        metadata:
          title: Telegram Image
          media_class: image

      final_prompt: >
        {{ prompt }}

        {% if caption != '' %}
        Người dùng yêu cầu thêm:
        {{ caption }}
        {% endif %}

  #############################################################
  # AI TASK PHÂN TÍCH
  #############################################################

  - action: ai_task.generate_data
    data:
      entity_id: "{{ ai_task_entity }}"
      task_name: Telegram Image Analysis
      instructions: "{{ final_prompt }}"
      attachments:
        - "{{ image_attachment }}"

    response_variable: ai_result

  #############################################################
  # GỬI KẾT QUẢ
  #############################################################

  - action: telegram_bot.send_photo
    data:

      target: "{{ telegram_chat_id }}"

      file: "{{ local_file }}"

      caption: >
        🤖 PHÂN TÍCH AI

        {{ ai_result.data if ai_result.data is defined else 'Không có phản hồi' }}
