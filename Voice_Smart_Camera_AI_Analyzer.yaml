blueprint:
  name: Voice - Smart Camera Analyzer
  author: Thaidv_fixed 
  description: >
    Tự động phát hiện:
      - Hỏi 1 camera → Trả lời trực tiếp
      - Hỏi nhiều camera → Phân tích tuần tự rồi tổng hợp
  domain: automation
  homeassistant:
    min_version: 2025.8.0
  input:
    entity_aliases_settings:
      name: Settings for Entity Aliases
      icon: mdi:format-list-bulleted
      selector:
        entity:
          filter:
            - domain:
                - sensor
              integration: template
          multiple: false

    ai_task_settings:
      name: AI Task Settings
      icon: mdi:robot-outline
      selector:
        object:
          properties:
            ai_task_entity:
              name: AI Task Entity
              selector:
                entity:
                  filter:
                    - domain:
                        - ai_task
                  multiple: false

            delay_between_cameras:
              name: Delay Between Cameras (seconds)
              description: Chỉ dùng khi phân tích nhiều camera
              selector:
                number:
                  min: 0.0
                  max: 10.0
                  step: 0.5
                  unit_of_measurement: s
                  mode: slider
              default: 1
          required: []

    instructions:
      name: Camera Question
      description: >
        Hỏi về camera (VD "camera phòng khách có người không", "tất cả camera thấy gì")
      selector:
        text:
          multiline: true
      required: true

trigger:
  - platform: event
    event_type: conversation_start

variables:
  entity_aliases: !input entity_aliases_settings
  ai_task_settings: !input ai_task_settings
  ai_task_entity: "{{ ai_task_settings.ai_task_entity if ai_task_settings.ai_task_entity else '' }}"
  delay_between_cameras: "{{ ai_task_settings.delay_between_cameras if ai_task_settings.delay_between_cameras else 1 }}"
  user_question: "{{ instructions | default('') | trim }}"

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ user_question == '' }}"
        sequence:
          - variables:
              response:
                error: "Vui lòng nhập câu hỏi"
          - stop: "Missing question"

  - variables:
      all_cameras: >
        {% set cams = states.camera
           | selectattr('state','in',['idle','streaming','recording'])
           | map(attribute='entity_id')
           | list %}
        {{ cams }}
      user_question_lc: "{{ user_question | lower }}"

  - variables:
      is_multi_camera_request: >
        {% set q = user_question_lc %}
        {{ 'tất cả' in q or
           'all camera' in q or
           'camera nào' in q or
           'các camera' in q or
           'toàn bộ' in q }}

      matched_camera_from_friendly: >
        {% set q = user_question_lc %}
        {% set found = '' %}
        {% for cam in all_cameras %}
          {% set fn = (state_attr(cam,'friendly_name') or '') | lower %}
          {% if q in fn %}
            {% set found = cam %}
          {% endif %}
        {% endfor %}
        {{ found }}

      matched_camera_from_alias: >
        {% set entities = state_attr(entity_aliases, 'entities') | default([]) %}
        {% set ql = user_question_lc %}
        {% set found = '' %}
        {% for item in entities %}
          {% set eid = item.entity_id %}
          {% set als = item.aliases | default([]) %}
          {% if 'camera.' in eid %}
            {% for a in als %}
              {% if ql in (a | lower) %}
                {% set found = eid %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endfor %}
        {{ found }}

      guessed_camera: >
        {% set q = user_question_lc %}
        {% set guess = '' %}
        {% for cam in all_cameras %}
          {% set name = (state_attr(cam,'friendly_name') or '') | lower %}
          {% if 'phòng khách' in q and 'phòng khách' in name %}
            {% set guess = cam %}
          {% elif 'ban công' in q and 'ban công' in name %}
            {% set guess = cam %}
          {% elif 'cửa' in q and 'cửa' in name %}
            {% set guess = cam %}
          {% endif %}
        {% endfor %}
        {{ guess }}

      final_camera: >
        {{ matched_camera_from_friendly
           or matched_camera_from_alias
           or guessed_camera
           or '' }}

      use_mode: >
        {% if is_multi_camera_request %}
          multi
        {% elif final_camera %}
          single
        {% else %}
          multi
        {% endif %}

  #######################################################################
  #                           SINGLE CAMERA                             #
  #######################################################################

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ use_mode == 'single' }}"
        sequence:
          - variables:
              img_available: >
                {% if state_attr(final_camera,'last_updated') is none %}
                  false
                {% else %}
                  true
                {% endif %}

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not img_available }}"
                sequence:
                  - variables:
                      response:
                        camera: "{{ final_camera }}"
                        camera_name: "{{ state_attr(final_camera,'friendly_name') }}"
                        answer: "Không lấy được hình ảnh từ camera (offline hoặc mất nguồn)."
                        timestamp: "{{ now().isoformat() }}"
                  - stop: "No image"

          - variables:
              camera_name: "{{ state_attr(final_camera,'friendly_name') }}"
              single_prompt: >
                USER QUESTION: "{{ user_question }}"
                - Trả lời bằng tiếng Việt
                - Tối đa 2–3 câu
                - Về con người: "Có người" / "Không có người"
                - Nếu tối hoặc bị che: "Camera bị tối/che khuất"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ ai_task_entity == '' }}"
                sequence:
                  - service: ai_task.generate_data
                    data:
                      task_name: "Analyze {{ camera_name }}"
                      instructions: "{{ single_prompt }}"
                      attachments:
                        - media_content_id: "media-source://camera/{{ final_camera }}"
                          media_content_type: image/jpeg
                    response_variable: ai_result
              default:
                - service: ai_task.generate_data
                  data:
                    entity_id: "{{ ai_task_entity }}"
                    task_name: "Analyze {{ camera_name }}"
                    instructions: "{{ single_prompt }}"
                    attachments:
                      - media_content_id: "media-source://camera/{{ final_camera }}"
                        media_content_type: image/jpeg
                  response_variable: ai_result

          - variables:
              response:
                mode: "single"
                camera: "{{ final_camera }}"
                camera_name: "{{ camera_name }}"
                answer: "{{ ai_result.data if ai_result.data is defined else 'Lỗi phân tích' }}"
                timestamp: "{{ now().isoformat() }}"

  #######################################################################
  #                           MULTI CAMERA                              #
  #######################################################################

      - conditions:
          - condition: template
            value_template: "{{ use_mode == 'multi' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ all_cameras | length == 0 }}"
                sequence:
                  - variables:
                      response:
                        error: "Không tìm thấy camera nào"
                  - stop: "No cameras"

          - variables:
              analysis_prompt: >
                USER QUESTION: "{{ user_question }}"
                - Trả lời 1–2 câu bằng tiếng Việt
                - Con người: "Có người" / "Không có người"
                - Nếu tối: "Camera tối/che khuất"
              camera_results: []

          - repeat:
              for_each: "{{ all_cameras }}"
              sequence:
                - variables:
                    current_camera: "{{ repeat.item }}"
                    camera_name: "{{ state_attr(repeat.item,'friendly_name') }}"

                - variables:
                    img_available: >
                      {% if state_attr(current_camera,'last_updated') is none %}
                        false
                      {% else %}
                        true
                      {% endif %}

                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ not img_available }}"
                      sequence:
                        - variables:
                            camera_results: >
                              {{ camera_results + [{
                                'camera': current_camera,
                                'camera_name': camera_name,
                                'analysis': 'Không lấy được hình ảnh (offline).',
                                'timestamp': now().isoformat()
                              }] }}
                        - continue

                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ ai_task_entity == '' }}"
                      sequence:
                        - service: ai_task.generate_data
                          data:
                            task_name: "Analyze {{ camera_name }}"
                            instructions: "{{ analysis_prompt }}"
                            attachments:
                              - media_content_id: "media-source://camera/{{ current_camera }}"
                                media_content_type: image/jpeg
                          response_variable: ai_single_result
                    default:
                      - service: ai_task.generate_data
                        data:
                          entity_id: "{{ ai_task_entity }}"
                          task_name: "Analyze {{ camera_name }}"
                          instructions: "{{ analysis_prompt }}"
                          attachments:
                            - media_content_id: "media-source://camera/{{ current_camera }}"
                              media_content_type: image/jpeg
                        response_variable: ai_single_result

                - variables:
                    camera_results: >
                      {{ camera_results + [{
                        'camera': current_camera,
                        'camera_name': camera_name,
                        'analysis': ai_single_result.data if ai_single_result.data is defined else 'Lỗi phân tích',
                        'timestamp': now().isoformat()
                      }] }}

                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ repeat.index < (all_cameras | length) }}"
                      sequence:
                        - delay:
                            seconds: "{{ delay_between_cameras }}"

          - variables:
              summary_prompt: >
                USER QUESTION: "{{ user_question }}"
                Hãy tổng hợp kết quả các camera bằng tiếng Việt (2–4 câu):
                {% for item in camera_results %}
                - {{ item.camera_name }}: {{ item.analysis }}
                {% endfor %}

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ ai_task_entity == '' }}"
                sequence:
                  - service: ai_task.generate_data
                    data:
                      task_name: "Summary"
                      instructions: "{{ summary_prompt }}"
                    response_variable: ai_summary_result
              default:
                - service: ai_task.generate_data
                  data:
                    entity_id: "{{ ai_task_entity }}"
                    task_name: "Summary"
                    instructions: "{{ summary_prompt }}"
                  response_variable: ai_summary_result

          - variables:
              response:
                mode: "multi"
                camera_count: "{{ all_cameras | length }}"
                individual_results: "{{ camera_results }}"
                summary: "{{ ai_summary_result.data }}"
                timestamp: "{{ now().isoformat() }}"

  - service: system_log.write
    data:
      message: "Camera Analysis Result: {{ response }}"
      level: info
