blueprint:
  name: Voice - Smart Camera Analyzer (Single + Sequential)
  author: benbap_fixed
  description: 'Tự động phát hiện: - Hỏi 1 camera → Trả lời trực tiếp - Hỏi nhiều camera → Phân tích tuần tự rồi tổng hợp'
  domain: script
  homeassistant:
    min_version: 2025.8.0

input:
  entity_aliases_settings:
    name: Settings for Entity Aliases
    icon: mdi:format-list-bulleted
    input:
      entity_aliases:
        name: Entity Aliases
        selector:
          entity:
            filter:
              - domain:
                - sensor
                integration: template
            multiple: false
            reorder: false

  ai_task_settings:
    name: AI Task Settings
    icon: mdi:robot-outline
    collapsed: true
    input:
      ai_task_entity:
        name: AI Task Entity
        selector:
          entity:
            filter:
              - domain:
                - ai_task
            multiple: false
            reorder: false
      delay_between_cameras:
        name: Delay Between Cameras (seconds)
        description: Chỉ dùng khi phân tích nhiều camera
        selector:
          number:
            min: 0.0
            max: 10.0
            step: 0.5
            unit_of_measurement: s
            mode: slider
        default: 1

source_url: https://github.com/thaibacgiang/thaibot/edit/main/Voice_Smart_Camera_AI_Analyzer.yaml
mode: parallel
max_exceeded: silent

fields:
  instructions:
    name: Camera Question
    description: Hỏi về camera (VD "camera phòng khách có người không", "tất cả camera thấy gì")
    selector:
      text:
        multiline: true
    required: true

sequence:
  - variables:
      entity_aliases: !input entity_aliases
      ai_task_entity: !input ai_task_entity
      delay: !input delay_between_cameras
      question: '{{ instructions | trim }}'

  - if:
      - condition: template
        value_template: '{{ not question }}'
    then:
      - stop: Missing question
        response_variable: { error: "Vui lòng nhập câu hỏi" }

  - variables:
      cameras: >
        {{ states.camera 
           | selectattr('state', 'in', ['idle', 'streaming', 'recording'])
           | map(attribute='entity_id') | list }}
      q_lower: '{{ question | lower }}'

  - variables:
      is_multi: >
        {{ ['tất cả', 'all camera', 'camera nào', 'những camera', 
            'các camera', 'which cameras', 'check all', 'toàn bộ'] 
           | select('in', q_lower) | list | count > 0 }}

      # Tìm camera theo friendly name
      cam_by_friendly: >
        {% set ns = namespace(found='') %}
        {% for cam in cameras %}
          {% set fn = state_attr(cam, 'friendly_name') | default('') | trim | lower %}
          {% if fn and (fn == q_lower or fn in q_lower) %}
            {% set ns.found = cam %}
          {% endif %}
        {% endfor %}
        {{ ns.found }}

      # Tìm camera theo alias
      cam_by_alias: >
        {% set ns = namespace(found='') %}
        {% for item in state_attr(entity_aliases, 'entities') | default([]) %}
          {% if 'camera.' in item.entity_id %}
            {% for alias in item.aliases | default([]) %}
              {% set a_lower = alias | lower %}
              {% if a_lower == q_lower or a_lower in q_lower %}
                {% set ns.found = item.entity_id %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endfor %}
        {{ ns.found }}

      # Tìm camera theo keyword guess
      cam_by_guess: >
        {% set ns = namespace(found='') %}
        {% set keywords = ['phòng khách', 'nhà xe', 'cửa trước', 'phòng master', 'phòng bếp'] %}
        {% for kw in keywords %}
          {% if kw in q_lower %}
            {% for cam in cameras %}
              {% if kw in (state_attr(cam, 'friendly_name') | default('') | lower) %}
                {% set ns.found = cam %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endfor %}
        {{ ns.found }}

      # Chọn camera theo thứ tự ưu tiên: friendly > alias > guess
      matched_camera: '{{ cam_by_friendly or cam_by_alias or cam_by_guess }}'

      # Xác định mode: single nếu tìm thấy camera cụ thể và không phải multi request
      mode: '{{ "single" if matched_camera and not is_multi else "multi" }}'

  - choose:
      # SINGLE CAMERA MODE
      - conditions: '{{ mode == "single" }}'
        sequence:
          - variables:
              cam_name: '{{ state_attr(matched_camera, "friendly_name") or matched_camera }}'
              prompt: >
                You are analyzing a single camera frame.
                CAMERA: {{ cam_name }}
                USER QUESTION: "{{ question }}"
                INSTRUCTIONS:
                - Answer in VIETNAMESE with proper diacritics
                - Be conversational and natural (2-3 sentences max)
                - If asked about people: "Có người" or "Không có người"
                - If asked to describe: mention main visible elements
                - If dark/blocked: "Camera bị tối/che khuất"
                Answer directly, no extra formatting.

          - variables:
              attachment:
                media_content_id: media-source://camera/{{ matched_camera }}
                media_content_type: image/jpeg
                metadata:
                  title: '{{ cam_name }}'
                  media_class: image

          - action: ai_task.generate_data
            data:
              {% if ai_task_entity %}
              entity_id: '{{ ai_task_entity }}'
              {% endif %}
              task_name: Analyze {{ cam_name }}
              instructions: '{{ prompt }}'
              attachments:
                - '{{ attachment }}'
            response_variable: result

          - stop: ''
            response_variable:
              mode: single
              camera: '{{ matched_camera }}'
              camera_name: '{{ cam_name }}'
              answer: '{{ result.data | default("Lỗi phân tích") }}'
              timestamp: '{{ now().isoformat() }}'

      # MULTI CAMERA MODE
      - conditions: '{{ mode == "multi" }}'
        sequence:
          - if:
              - condition: template
                value_template: '{{ cameras | length == 0 }}'
            then:
              - stop: No cameras
                response_variable: { error: "Không tìm thấy camera nào" }

          - variables:
              analysis_prompt: >
                Analyze this single camera frame.
                USER QUESTION: "{{ question }}"
                Answer in VIETNAMESE (1-2 sentences):
                - People detection: "Có người" or "Không có người"
                - Description: main objects/people/pets
                - Issues: "Camera tối/che khuất" if applicable
              results: []

          - repeat:
              for_each: '{{ cameras }}'
              sequence:
                - variables:
                    current: '{{ repeat.item }}'
                    cam_name: '{{ state_attr(repeat.item, "friendly_name") or repeat.item }}'
                    attachment:
                      media_content_id: media-source://camera/{{ current }}
                      media_content_type: image/jpeg
                      metadata:
                        title: '{{ cam_name }}'
                        media_class: image

                - action: ai_task.generate_data
                  data:
                    {% if ai_task_entity %}
                    entity_id: '{{ ai_task_entity }}'
                    {% endif %}
                    task_name: Analyze {{ cam_name }}
                    instructions: '{{ analysis_prompt }}'
                    attachments:
                      - '{{ attachment }}'
                  response_variable: single_result

                - variables:
                    results: >
                      {{ results + [{
                        'camera': current,
                        'camera_name': cam_name,
                        'analysis': single_result.data | default('Lỗi'),
                        'timestamp': now().isoformat()
                      }] }}

                - if:
                    - condition: template
                      value_template: '{{ repeat.index < cameras | length }}'
                  then:
                    - delay:
                        seconds: '{{ delay }}'

          - variables:
              summary_prompt: >
                Summarize these camera analysis results in Vietnamese.
                USER QUESTION: "{{ question }}"
                RESULTS:
                {% for r in results %}
                - {{ r.camera_name }}: {{ r.analysis }}
                {% endfor %}
                Create a natural 2-4 sentence summary:
                - If asked about people: list cameras WITH people, then WITHOUT
                - If asked to describe: overview of what's visible
                - Keep it conversational for voice assistant

          - action: ai_task.generate_data
            data:
              {% if ai_task_entity %}
              entity_id: '{{ ai_task_entity }}'
              {% endif %}
              task_name: Summary
              instructions: '{{ summary_prompt }}'
            response_variable: summary_result

          - stop: ''
            response_variable:
              mode: multi
              camera_count: '{{ cameras | length }}'
              individual_results: '{{ results }}'
              summary: '{{ summary_result.data | default("Không tổng hợp được") }}'
              timestamp: '{{ now().isoformat() }}'
