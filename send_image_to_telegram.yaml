blueprint:
  name: Voice - Send Image to Telegram (HA 2026+)
  author: Thaidv1 (fixed & stabilized)
  description: >
    📸 Gửi ảnh từ Camera đến Telegram – tương thích Home Assistant 2026.1.0+
    - Không dùng chat_id
    - Dùng target theo schema mới
    - Hỗ trợ Telegram Group Forum (topic)
    - Không lỗi YAML / Jinja
    - Import được ngay

  domain: script
  homeassistant:
    min_version: 2026.1.0

  input:
    telegram_settings:
      name: Cài đặt Telegram
      icon: mdi:telegram
      input:
        target:
          name: Target (Chat / Group ID)
          description: >
            ID người nhận hoặc Group Telegram.
            Ví dụ: -1002936213456
          selector:
            text:

        message_thread_id:
          name: Message Thread ID (tuỳ chọn)
          description: >
            ID topic nếu group dạng Forum.
            Để trống nếu không dùng.
          selector:
            text:
          default: ''

        caption:
          name: Caption mặc định
          selector:
            text:
              multiline: true
          default: ''

mode: queued
max: 30
max_exceeded: silent

fields:
  image_path:
    name: Image URL
    selector:
      text:
    required: true

  message:
    name: Message
    selector:
      text:

sequence:
  - alias: "🧹 Chuẩn hoá dữ liệu"
    variables:
      clean_path: >
        {% set raw = image_path | trim %}
        {% if '(' in raw and ')' in raw %}
          {{ raw | regex_replace('\\[.*?\\]\\((.*?)\\)', '\\1') }}
        {% else %}
          {{ raw }}
        {% endif %}
      final_caption: >
        {{ message if message | default('') | length > 0 else (caption | default('')) }}

  - alias: "📤 Gửi ảnh Telegram (không topic)"
    choose:
      - conditions:
          - condition: template
            value_template: "{{ message_thread_id | default('') | length == 0 }}"
        sequence:
          - action: telegram_bot.send_photo
            data:
              target: !input target
              url: "{{ clean_path }}"
              caption: "{{ final_caption }}"

      - conditions:
          - condition: template
            value_template: "{{ message_thread_id | default('') | length > 0 }}"
        sequence:
          - action: telegram_bot.send_photo
            data:
              target: !input target
              message_thread_id: !input message_thread_id
              url: "{{ clean_path }}"
              caption: "{{ final_caption }}"
